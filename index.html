function clone(x){return JSON.parse(JSON.stringify(x))}
function defaultSegments(it){
 if(it.segments&&it.segments.length)return it.segments;
 if(it.rule==='BP_HIGH')return [
  {id:'top',label:'Top Set',weight:it.weight,sets:1,reps:it.reps||4,repsMin:4,repsMax:6,rpeMin:7,rpeMax:8},
  {id:'backoff',label:'Backoff',weight:Math.round((it.weight*0.89)*2)/2,sets:3,reps:5,repsMin:5,repsMax:5,rpeMin:6.5,rpeMax:7.5}
 ];
 if(it.rule==='DL_MAIN')return [
  {id:'top',label:'Top Set',weight:it.weight,sets:1,reps:it.reps||3,repsMin:3,repsMax:5,rpeMin:7,rpeMax:8},
  {id:'backoff',label:'Backoff',weight:Math.round((it.weight*0.87)*2)/2,sets:2,reps:5,repsMin:5,repsMax:5,rpeMin:6.5,rpeMax:7.5}
 ];
 return [{id:'main',label:'Main',weight:it.weight,sets:it.sets,reps:it.reps,repsMin:it.repsMin||it.reps,repsMax:it.repsMax||it.reps,rpeMin:it.rpeMin,rpeMax:it.rpeMax,unit:it.unit||'reps'}];
}
function ensureSegments(it){it.segments=defaultSegments(it).map(function(s){return Object.assign({},s)});return it}
function segmentSummary(it){
 const segs=defaultSegments(it);
 if(segs.length===1)return (segs[0].weight||'—')+'kg · '+segs[0].sets+'×'+segs[0].reps+' · @'+segs[0].rpeMin+'~'+segs[0].rpeMax;
 return segs.map(function(s){return s.label+' '+(s.weight||'—')+'kg '+s.sets+'×'+(s.repsMin!==s.repsMax?s.repsMin+'~'+s.repsMax:s.reps)+(s.unit==='sec'?'초':'')}).join(' / ');
}
function segmentSets(w,id){return w.sets.filter(function(s){return (s.segmentId||'top')===id})}
function activeSegment(w){
 const segs=defaultSegments(w.it);
 for(let i=0;i<segs.length;i++){if(segmentSets(w,segs[i].id).length<segs[i].sets)return segs[i]}
 return null;
}
function syncInputToSegment(w){

}
function defaultExerciseMinutes(it){
 if(it.rule==='SQ_HIGH')return 60;if(it.rule==='DL_MAIN')return 50;if(it.rule==='BP_HIGH')return 45;

 if(it.rule==='ARM_SIDE')return 12;return 10
}
function programStartMonday(){
 const raw=(data&&data.program&&data.program.startDate)||seed.program.startDate;
 const d=new Date(raw+'T00:00:00');const day=d.getDay();const diff=(day===0?-6:1-day);d.setDate(d.getDate()+diff);return d
}
function weekStartDate(weekNum){

}

function dateForDay(code,weekNum){

}
function availableMinutes(code){
 const date=dateForDay(code);if(data.dateAvailability&&data.dateAvailability[date]!=null)return Number(data.dateAvailability[date])||0;

}
function recentDurations(it){
 const rows=[];(data.archives||[]).forEach(function(a){(a.logs||[]).forEach(function(l){if(!l.deletedAt&&l.name===it.name&&l.type===it.type&&l.durationMinutes)rows.push(l.durationMinutes)})});
 (data.logs||[]).forEach(function(l){if(!l.deletedAt&&l.name===it.name&&l.type===it.type&&l.durationMinutes)rows.push(l.durationMinutes)});

}
function median(arr){if(!arr.length)return 0;const a=arr.slice().sort(function(x,y){return x-y}),m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function exerciseEstimate(it){const r=recentDurations(it);return Math.round(r.length>=3?median(r):Number(it.estimatedMinutes||defaultExerciseMinutes(it)))}
function sessionEstimate(s){return s.items.filter(function(it){return !it.deletedAt}).reduce(function(a,it){return a+exerciseEstimate(it)},0)}

function migrate(x){

}
const DB_NAME='strength-tracker-db',DB_VERSION=2,STORE='kv';
const ENTITY_STORES=['appSettings','programs','blocks','weeks','sessions','exercises','sets','scheduleChanges','recoveryCheckins','recommendations','bodyweightLogs'];
function openDB(){
 return new Promise(function(resolve,reject){
  if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=function(){const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);ENTITY_STORES.forEach(function(s){if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'})})};
  req.onsuccess=function(){resolve(req.result)};
  req.onerror=function(){reject(req.error||new Error('IndexedDB open failed'))}
 })
}
async function idbGet(key){
 const db=await openDB();
 return new Promise(function(resolve,reject){
  const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get(key);
  req.onsuccess=function(){resolve(req.result)};
  req.onerror=function(){reject(req.error)};
  tx.oncomplete=function(){db.close()}
 })
}
async function idbPut(key,value){
 const db=await openDB();
 return new Promise(function(resolve,reject){
  const tx=db.transaction(STORE,'readwrite');
  tx.objectStore(STORE).put(clone(value),key);
  tx.oncomplete=function(){db.close();resolve()};
  tx.onerror=function(){db.close();reject(tx.error)}
 })
}
async function mirrorEntityStores(state){
 const db=await openDB();
 return new Promise(function(resolve,reject){
  const tx=db.transaction(ENTITY_STORES,'readwrite');
  ENTITY_STORES.forEach(function(s){tx.objectStore(s).clear()});
  tx.objectStore('appSettings').put({id:'settings',week:state.week,weekState:state.weekState,defaultAvailability:state.defaultAvailability,dateAvailability:state.dateAvailability,lastBackupAt:state.lastBackupAt});
  tx.objectStore('programs').put(Object.assign({id:'program-001'},state.program||{}));
  (state.blocks||[]).forEach(function(x){tx.objectStore('blocks').put(Object.assign({},x))});
  tx.objectStore('weeks').put({id:'week-'+state.week,weekNumber:state.week,state:state.weekState,programId:state.program.id,blockId:state.program.currentBlockId,startDate:isoDate(weekStartDate(state.week))});
  (state.days||[]).forEach(function(s,si){
    tx.objectStore('sessions').put({id:'w'+state.week+'-'+s.d,weekId:'week-'+state.week,day:s.d,scheduled:s.scheduled,status:s.status,plannedDate:dateForDay(s.d),scheduledDate:dateForDay(s.scheduled),estimatedMinutes:sessionEstimate(s),skipReason:s.skipReason||null});
    (s.items||[]).forEach(function(it,ii){tx.objectStore('exercises').put({id:'w'+state.week+'-'+s.d+'-'+ii,sessionId:'w'+state.week+'-'+s.d,name:it.name,type:it.type,rule:it.rule,plan:planSnapshot(it),estimatedMinutes:exerciseEstimate(it),deletedAt:it.deletedAt||null})})
  });
  (state.logs||[]).forEach(function(l,li){(l.sets||[]).forEach(function(set,si){tx.objectStore('sets').put(Object.assign({id:(l.id||'log'+li)+'-set-'+si,exerciseLogId:l.id||('log'+li)},set))})});
  (state.scheduleChanges||[]).forEach(function(x,i){tx.objectStore('scheduleChanges').put(Object.assign({id:x.id||('sc-'+i)},x))});
  (state.recoveryChecks||[]).forEach(function(x,i){tx.objectStore('recoveryCheckins').put(Object.assign({id:x.id||('rc-'+i)},x))});
  (state.recommendations||[]).forEach(function(x,i){tx.objectStore('recommendations').put(Object.assign({id:x.id||('rec-'+i)},x))});
  (state.bodyweightLogs||[]).forEach(function(x){tx.objectStore('bodyweightLogs').put(Object.assign({},x))});
  tx.oncomplete=function(){db.close();resolve()};tx.onerror=function(){db.close();reject(tx.error)}
 })
}
async function loadData(){
 try{
  const saved=await idbGet('appState');
  if(saved){storageMode='IndexedDB';return migrate(saved)}
  let legacy=null;
  try{legacy=JSON.parse(localStorage.getItem(STORAGE)||'null')}catch(e){}
  const initial=migrate(legacy||clone(seed));
  await idbPut('appState',initial);
  storageMode=legacy?'IndexedDB · migrated':'IndexedDB';
  return initial
 }catch(e){
  storageMode='localStorage fallback';
  try{return migrate(JSON.parse(localStorage.getItem(STORAGE))||clone(seed))}catch(err){return migrate(clone(seed))}
 }

function evaluate(ctx){
 const w=workout,it=w.it,segs=defaultSegments(it),all=w.sets,allR=all.map(function(x){return x.rpe}),max=Math.max.apply(null,allR),last=allR[allR.length-1];
 const critical=ctx.tech.some(function(x){return ['Grip Open','Bar Roll','Brace Loss','Upper Back Loss','Wedge Failure'].includes(x)});
 const majorExternal=ctx.external.some(function(x){return ['J-cup Collision','Strap Failure','Slippery Bar/Bench'].includes(x)});
 const combined=currentCombinedRisk(w.day).level==='RED';
 const blocked=ctx.pain>=3||critical||((majorExternal||combined)&&max>=8.5);
 const lowKey=it.rule==='LOW'?lowStreakKey(it):null;
 let verdict='HOLD',next=it.weight,nsets=it.sets,nreps=it.reps,msg='동일 계획 유지',segmentRecommendations=[];
 if(segs.length>1&&(it.rule==='BP_HIGH'||it.rule==='DL_MAIN')){
  segmentRecommendations=segs.map(function(s){
   const ss=segmentSets(w,s.id),rs=ss.map(function(x){return x.rpe}),mx=Math.max.apply(null,rs),lst=rs[rs.length-1];
   let v='HOLD',nw=s.weight,nr=s.reps,ns=s.sets,m='동일 계획 유지';
   if(blocked){v='REVIEW';m=ctx.pain>=3?'통증으로 자동 progression 보류':critical?'기술 이슈로 자동 progression 보류':'외부/고피로 변수로 판정 보류'}
   else if(s.id==='top'){
    const cap=it.rule==='BP_HIGH'?6:5,base=it.rule==='BP_HIGH'?4:3;
    if(mx<=8){v='PROGRESS';if(s.reps<cap)nr=s.reps+1;else{nw=s.weight+2.5;nr=base}m='Top set: reps 우선 progression'}

   }else{

   }
   return {id:s.id,label:s.label,verdict:v,nextWeight:nw,nextSets:ns,nextReps:nr,max:mx,last:lst,msg:m}
  });
  const rank={REDUCE:5,REVIEW:4,HOLD:3,FAST_TRACK:2,PROGRESS:1};
  const worst=segmentRecommendations.slice().sort(function(a,b){return (rank[b.verdict]||0)-(rank[a.verdict]||0)})[0];
  verdict=worst.verdict;msg='Top/Backoff를 독립 판정했습니다.';
  const topRec=segmentRecommendations.find(function(x){return x.id==='top'});
  next=topRec.nextWeight;nsets=topRec.nextSets;nreps=topRec.nextReps;
 }else{
  if(ctx.pain>=3){verdict='REVIEW';msg='통증 '+ctx.pain+': 자동 progression 보류';if(lowKey)data.streaks[lowKey]=0}
  else if(critical){verdict='REVIEW';msg='Critical technique issue: 자동 progression 보류';if(lowKey)data.streaks[lowKey]=0}
  else if((majorExternal||combined)&&max>=8.5){verdict='REVIEW';msg=(majorExternal?'외부 변수':'고피로 병합')+'로 고RPE 해석 보류'}
  else if(workout.earlyFinish){verdict='INCOMPLETE';msg='계획 미완료 · '+(ctx.incompleteReason||'Reason not set');if(lowKey&&['Strength Failure','Technique','Pain'].includes(ctx.incompleteReason))data.streaks[lowKey]=0}
  else if(it.rule==='SQ_HIGH'){
    if(max<=5.5&&last<=5.5){verdict='FAST_TRACK';next=it.weight+5;msg='매우 여유로움: +5kg 8×3 제안'}
    else if(max<=6.5&&last<=6.5){verdict='FAST_TRACK';next=it.weight+2.5;msg='여유로움: +2.5kg 8×3 제안'}

    if(max<=7.5){verdict='PROGRESS';if(it.reps<5)nreps=it.reps+1;else{next=it.weight+2.5;nreps=3}msg='Medium 4×3→4→5 progression'}else if(max>=8.5){verdict='HOLD';msg='Medium 난도 과다: 유지'}
  }else if(it.rule==='BP_MED'){
    if(max<=7.5){verdict='PROGRESS';if(it.reps<10)nreps=it.reps+1;else{next=it.weight+2.5;nreps=8}msg='TnG 4×8→9→10 progression'}else if(max>=8){verdict='HOLD';msg='TnG 난도 과다: 유지'}

  }

    if(max<=8&&ctx.pain<=1){verdict='PROGRESS';if(it.reps<maxRep)nreps=it.reps+1;else{next=it.weight>0?it.weight+2.5:it.weight;nreps=min}msg=it.reps<maxRep?'Arm double progression: +1 rep':'상한 반복 달성: 부하 증가 후 reps reset'}

  }else if(it.rule==='ARM_SIDE'){
    const min=it.repsMin||it.reps,maxRep=it.repsMax||it.reps;let pNext=it.weight,pReps=it.reps;
    if(it.reps<maxRep)pReps=it.reps+1;else{pNext=it.weight>0?it.weight+2.5:it.weight;pReps=min}
    if(ctx.pain<=1&&max<=it.rpeMax){verdict='PENDING';msg='Side pressure: 다음날 관절 체크 후 progression 확정';const id='rc-'+data.week+'-'+w.day.d+'-'+it.name+'-'+it.type;data.recoveryChecks=data.recoveryChecks.filter(function(x){return x.id!==id});data.recoveryChecks.push({id:id,week:data.week,day:w.day.d,name:it.name,type:it.type,status:'PENDING',sameDayPain:ctx.pain,createdAt:new Date().toISOString(),proposed:{next:pNext,nsets:it.sets,nreps:pReps}})}

  }
 }
 data.recommendations=data.recommendations.filter(function(x){return !(x.day===w.day.d&&x.name===it.name&&x.type===it.type)});
 data.recommendations.push({day:w.day.d,name:it.name,type:it.type,verdict:verdict,next:next,nsets:nsets,nreps:nreps,max:max,last:last,msg:msg,pain:ctx.pain,tech:ctx.tech,external:ctx.external,combined:combined,segmentRecommendations:segmentRecommendations,lowStreak:lowKey?(data.streaks[lowKey]||0):null});

 if(!data.draft)return;
 const s=data.draft.days.find(function(x){return x.d===dayId}),it=s&&s.items[itemIndex];if(!it)return;
 const segs=defaultSegments(it),sys=it.systemPlan||planSnapshot(it);
 const body=segs.map(function(seg,idx){return '<div class="session-card"><b>'+esc(seg.label)+'</b><div class="timegrid" style="grid-template-columns:repeat(3,1fr);margin-top:8px"><label>kg<input data-dw="'+idx+'" type="number" step="2.5" value="'+seg.weight+'"></label><label>세트<input data-ds="'+idx+'" type="number" min="1" value="'+seg.sets+'"></label><label>반복<input data-dr="'+idx+'" type="number" min="1" value="'+seg.reps+'"></label></div></div>'}).join('');
 const html='<div class="modal-center" id="draftModal"><div class="modal-card"><div class="row"><div><h2 style="margin:0">Draft Override</h2><p class="muted">'+esc(s.d+' · '+it.name+' '+it.type)+'</p></div><button class="smallbtn" id="draftClose">닫기</button></div>'+
 '<div class="banner info">시스템 추천: '+esc((sys.segments&&sys.segments.length?sys.segments.map(function(x){return x.label+' '+x.weight+'kg '+x.sets+'×'+x.reps}).join(' / '):sys.weight+'kg '+sys.sets+'×'+sys.reps))+'</div>'+
 body+'<span class="label">변경 이유</span><select id="draftReasonPreset" class="textarea" style="min-height:44px"><option value="">선택</option><option>피로도 조절</option><option>기술 적응 우선</option><option>일정 문제</option><option>대회 준비</option><option>컨디션</option><option>기타</option></select><textarea id="draftReason" class="textarea" placeholder="세부 이유 (선택)">'+esc(it.override&&it.override.note||'')+'</textarea>'+
 '<div class="actionrow"><button class="ghost" id="draftReset">시스템 추천으로 복원</button><button class="primary" id="draftSave" style="margin-top:0">변경 저장</button></div></div></div>';
 document.body.insertAdjacentHTML('beforeend',html);
 document.getElementById('draftClose').onclick=function(){document.getElementById('draftModal').remove()};
 document.getElementById('draftReset').onclick=function(){
   it.weight=sys.weight;it.sets=sys.sets;it.reps=sys.reps;it.segments=clone(sys.segments);it.override=null;save();document.getElementById('draftModal').remove();render()
 };
 document.getElementById('draftSave').onclick=function(){
   const cur=defaultSegments(it);
   cur.forEach(function(seg,idx){
     seg.weight=Number(document.querySelector('[data-dw="'+idx+'"]').value)||0;
     seg.sets=Math.max(1,Number(document.querySelector('[data-ds="'+idx+'"]').value)||1);
     seg.reps=Math.max(1,Number(document.querySelector('[data-dr="'+idx+'"]').value)||1);
   });
   it.segments=cur;it.weight=cur[0].weight;it.sets=cur[0].sets;it.reps=cur[0].reps;
   const preset=document.getElementById('draftReasonPreset').value,note=document.getElementById('draftReason').value||'';
   it.override={reason:preset||'기타',note:note,changedAt:new Date().toISOString(),systemPlan:clone(sys),selectedPlan:planSnapshot(it)};
   save();document.getElementById('draftModal').remove();render()
 };
}
function confirmDraft(){
 if(!data.draft)return;
 data.archives.push({week:data.week,completedAt:new Date().toISOString(),days:clone(data.days),logs:clone(data.logs),recommendations:clone(data.recommendations)});
 data.week=data.draft.week;data.days=clone(data.draft.days);data.logs=[];data.recommendations=[];data.draft=null;data.scheduleProposal=null;save();tab='home';render();
}
function week(){
 const resolvedCount=data.days.filter(isResolved).length,resolved=resolvedCount===data.days.length,pending=pendingRecovery(),reviewReady=resolved&&pending.length===0,rw=recoveryWarnings();
 const trans=transitionSuggestion();
 document.getElementById('app').innerHTML='<div class="top"><div><h1>주간 일정</h1><p class="sub">가능 시간 · SPLIT · 회복간격 · 피로도</p></div><span class="pill">W'+data.week+' · '+esc(currentBlock().name)+'</span></div>'+
 (trans?'<section class="card"><div class="banner warn"><b>'+esc(trans.label)+' 전환 제안</b><br>'+esc(trans.reason)+'</div><button class="primary" data-block="'+trans.target+'">전환 승인</button></section>':'')+
 '<section class="card"><div class="row"><h3>현재 주 실제 가능 시간</h3><button id="savetime" class="smallbtn">저장</button></div><div class="timegrid">'+DAYS.map(function(d){const date=dateForDay(d);return '<label><b>'+d+'</b><small>'+date.slice(5)+'</small><input data-date-time="'+date+'" type="number" value="'+availableMinutes(d)+'"><small>분</small></label>'}).join('')+'</div><button class="secondary" id="autoPlan">자동 재배치 제안</button></section>'+
 (rw.length?'<section class="card"><div class="banner warn"><b>회복 간격 경고</b><br>'+rw.map(esc).join('<br>')+'</div></section>':'')+
 (data.scheduleProposal?'<section class="card"><div class="row"><h3>자동 재배치 Draft</h3><button class="smallbtn" id="discardProposal">취소</button></div>'+data.scheduleProposal.map(function(p){return '<div class="proposal"><b>'+esc(p.label)+'</b><div class="muted">'+p.from+' → '+p.to+(p.from===p.to?' · 유지':'')+'</div></div>'}).join('')+(data.scheduleProposalWarnings&&data.scheduleProposalWarnings.length?'<div class="banner warn">'+data.scheduleProposalWarnings.map(esc).join('<br>')+'</div>':'')+'<button class="primary" id="applyProposal">이 일정 적용</button></section>':'')+
 (data.volumeProposal?'<section class="card"><div class="row"><h3>Volume Reduction Draft</h3><button class="smallbtn" id="discardVolume">취소</button></div><p class="muted">'+data.volumeProposal.day+' · 예상 '+data.volumeProposal.total+'분 / 가능 '+data.volumeProposal.available+'분</p>'+data.volumeProposal.changes.map(function(ch){return '<div class="proposal"><b>'+esc(ch.name+' '+ch.type)+'</b><div class="muted">'+ch.before+'세트 → '+ch.after+'세트</div></div>'}).join('')+(data.volumeProposal.remainingShortage?'<div class="banner danger">감량 후에도 약 '+data.volumeProposal.remainingShortage+'분 부족. 세션 이동을 권장합니다.</div>':'')+'<button class="primary" id="applyVolume">이 감량안 적용</button></section>':'')+
 '<section class="card"><h3>현재 배치</h3>'+DAYS.map(function(d){const base=dayScheduleHtml(d),short=estimateDay(d)>availableMinutes(d);return base+(short?'<button class="smallbtn" data-volume="'+d+'">시간 부족 해결안</button>':'')}).join('')+'</section>'+
 '<section class="card"><div class="row"><div><h3 style="margin:0">W'+data.week+' Review</h3><p class="muted">'+resolvedCount+' / '+data.days.length+' sessions resolved · '+currentWeekState()+'</p></div><span class="tag '+(reviewReady?'progress':pending.length?'review':'hold')+'">'+(reviewReady?'READY':pending.length?'RECOVERY PENDING':'IN PROGRESS')+'</span></div>'+
 '<div class="reviewgrid">'+data.days.map(function(s){return '<div class="reviewrow"><div><b>'+s.d+' · '+esc(s.label)+'</b><small class="muted">'+s.status+(s.isCarryOver&&s.carriedFromWeek?' · from W'+s.carriedFromWeek:'')+(s.skipReason?' · '+esc(s.skipReason):'')+'</small></div><span>'+s.items.map(function(it){const r=getRec(s,it);return r?'<span class="tag '+resultClass(r.verdict)+'">'+r.verdict+(r.lowStreak!==null&&r.lowStreak!==undefined?' · '+r.lowStreak+'/2':'')+'</span>':''}).join(' ')+'</span></div>'}).join('')+'</div>'+
 (!data.draft?'<button class="primary '+(reviewReady?'':'disabled')+'" id="makeDraft">W'+(data.week+1)+' Draft 생성</button>':
 '<div class="draftbox"><div class="row"><b>W'+data.draft.week+' DRAFT</b><span class="pill">DRAFT</span></div>'+data.draft.days.map(function(s){return '<div class="proposal"><div class="row"><b>'+s.d+' · '+esc(s.label)+'</b>'+(s.isCarryOver?'<span class="tag review">CARRY OVER</span>':'')+'</div>'+s.items.map(function(it,idx){return '<div class="session-card"><div class="row"><div><b>'+esc(it.name+' '+it.type)+'</b><div class="muted">'+esc(segmentSummary(it))+'</div>'+(it.override?'<div class="muted">Override · '+esc(it.override.reason)+(it.override.note?' · '+esc(it.override.note):'')+'</div>':'')+'</div><button class="smallbtn" data-draft-edit="'+s.d+'|'+idx+'">'+(it.override?'수정됨':'수정')+'</button></div></div>'}).join('')+'</div>'}).join('')+'<div class="actionrow"><button class="ghost" id="discardDraft">Draft 삭제</button><button class="primary" id="confirmDraft" style="margin-top:0">W'+data.draft.week+' 확정</button></div></div>')+
 '</section>';
}
function allExerciseLogs(){
 const out=[];
 (data.archives||[]).forEach(function(a){(a.logs||[]).forEach(function(l){out.push(Object.assign({week:a.week},l))})});
 (data.logs||[]).forEach(function(l){out.push(Object.assign({week:data.week},l))});
 return out
}
function setE1RM(s){if(!s||!s.weight||!s.reps||s.reps>12)return 0;return s.weight*(1+s.reps/30)}
function liftAnalytics(name){
 const rows=allExerciseLogs().filter(function(l){return l.name===name});
 return rows.map(function(l){
  const valid=(l.sets||[]).filter(function(s){return !s.isExtra&&s.weight>0&&s.reps>0});
  const e=valid.length?Math.max.apply(null,valid.map(setE1RM)):0;
  const vol=valid.reduce(function(a,s){return a+s.weight*s.reps},0);
  const avg=valid.length?valid.reduce(function(a,s){return a+(Number(s.rpe)||0)},0)/valid.length:0;
  return {week:l.week,e1rm:e,volume:vol,avgRpe:avg,date:l.completedAt||'',type:l.type}
 }).filter(function(x){return x.e1rm>0}).sort(function(a,b){return a.week-b.week||(a.date||'').localeCompare(b.date||'')})
}
function sparkline(values){
 if(!values.length)return '<div class="muted">데이터 없음</div>';
 const w=300,h=74,p=8,min=Math.min.apply(null,values),max=Math.max.apply(null,values),span=Math.max(1,max-min);
 const pts=values.map(function(v,i){const x=values.length===1?w/2:p+i*(w-2*p)/(values.length-1),y=h-p-(v-min)*(h-2*p)/span;return x.toFixed(1)+','+y.toFixed(1)}).join(' ');
 return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:74px;overflow:visible"><polyline points="'+pts+'" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/></svg>'
}
function fmt1(x){return Math.round(x*10)/10}
function analyticsPanel(){
 const lifts=['Squat','Bench Press','Deadlift'];
 const cards=lifts.map(function(name){const a=liftAnalytics(name),last=a[a.length-1],best=a.length?Math.max.apply(null,a.map(function(x){return x.e1rm})):0;return '<div class="session-card"><div class="row"><div><b>'+name+'</b><small class="muted">'+(last?'최근 e1RM '+fmt1(last.e1rm)+'kg':'기록 없음')+'</small></div><span class="pill">'+(best?'BEST '+fmt1(best):'—')+'</span></div>'+sparkline(a.map(function(x){return x.e1rm}))+'</div>'}).join('');
 const cur=allExerciseLogs().filter(function(l){return l.week===data.week&&['Squat','Bench Press','Deadlift'].includes(l.name)});
 const sets=cur.reduce(function(acc,l){return acc.concat(l.sets||[])},[]).filter(function(s){return s.weight>0&&s.reps>0});
 const vol=sets.reduce(function(a,s){return a+s.weight*s.reps},0),avg=sets.length?sets.reduce(function(a,s){return a+(Number(s.rpe)||0)},0)/sets.length:0;
 return '<section class="card"><div class="row"><div><h3 style="margin:0">SBD Analytics</h3><p class="muted">e1RM은 Epley 추정치로 참고용입니다.</p></div><span class="pill">W'+data.week+'</span></div>'+cards+'<div class="row" style="margin-top:10px"><div><b>이번 주 SBD Volume</b><div>'+Math.round(vol).toLocaleString()+' kg·reps</div></div><div style="text-align:right"><b>평균 RPE</b><div>'+(avg?fmt1(avg):'—')+'</div></div></div></section>'
}
function bodyweightPanel(){
 const arr=(data.bodyweightLogs||[]).slice().sort(function(a,b){return a.date.localeCompare(b.date)});
 const recent=arr.slice(-5).reverse();
 const today=new Date().toISOString().slice(0,10);
 return '<section class="card"><div class="row"><div><h3 style="margin:0">Bodyweight</h3><p class="muted">67kg급 추이</p></div><span class="pill">'+(arr.length?arr[arr.length-1].weight+'kg':'미입력')+'</span></div>'+
 sparkline(arr.map(function(x){return x.weight}))+
 '<div class="timegrid" style="grid-template-columns:1.4fr 1fr;margin-top:10px"><label>날짜<input id="bwDate" type="date" value="'+today+'"></label><label>체중 kg<input id="bwWeight" type="number" min="40" max="150" step=".1" placeholder="66.0"></label></div><button class="primary" id="saveBw">체중 저장</button>'+
 (recent.length?recent.map(function(x){return '<div class="history-item"><div><b>'+x.weight+' kg</b><small class="muted">'+x.date+'</small></div><button class="smallbtn" data-bw-del="'+x.id+'">삭제</button></div>'}).join(''):'<p class="muted">체중 기록이 없습니다.</p>')+'</section>'
}
function history(){
 const current=data.logs.length?'<section class="card"><h3>현재 W'+data.week+'</h3>'+data.logs.slice().reverse().map(function(l){const r=data.recommendations.find(function(x){return x.day===l.day&&x.name===l.name&&x.type===l.type});return '<div class="history-item"><div><b>'+l.day+' · '+esc(l.name)+' '+esc(l.type)+'</b><small class="muted">'+l.sets.length+'세트 · '+(l.evaluation?'통증 '+l.evaluation.pain:'')+'</small></div>'+(r?'<span class="tag '+resultClass(r.verdict)+'">'+r.verdict+'</span>':'')+'</div>'}).join('')+'</section>':'';
 const archived=data.archives.slice().reverse().map(function(a){return '<section class="card"><div class="row"><h3 style="margin:0">W'+a.week+'</h3><span class="tag progress">ARCHIVED</span></div><p class="muted">'+a.logs.length+' exercise logs · '+new Date(a.completedAt).toLocaleDateString('ko-KR')+'</p></section>'}).join('');
 document.getElementById('app').innerHTML='<div class="top"><div><h1>기록</h1><p class="sub">e1RM · Volume · RPE · 체중</p></div></div>'+analyticsPanel()+bodyweightPanel()+current+(archived||(!current?'<section class="card"><p class="muted">아직 훈련 기록이 없습니다.</p></section>':''));
}
function settings(){
 document.getElementById('app').innerHTML='<div class="top"><div><h1>설정</h1><p class="sub">서버 없는 IndexedDB 로컬 저장</p></div></div><section class="card"><h3>데이터 관리</h3><p class="muted">기록은 이 폰 브라우저의 IndexedDB에 저장됩니다. 폰 교체/브라우저 데이터 삭제 전에 JSON 백업을 권장합니다.</p><button class="primary" id="backup">JSON 백업</button><label class="secondary" style="display:grid;place-items:center;margin-top:10px;height:49px;border-radius:13px;font-weight:800">백업 복원<input id="restore" type="file" accept="application/json" style="display:none"></label><button class="danger" id="reset">전체 초기화</button></section>'+
 '<section class="card"><h3>현재 데이터</h3><p class="muted">Storage: '+esc(storageMode)+' · Schema v'+data.version+' · W'+data.week+' · 보관 주차 '+data.archives.length+'개</p></section>';
}
function bind(){
 if(document.getElementById('resumeWorkout'))document.getElementById('resumeWorkout').onclick=resumeWorkout;
 document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;workout=null;render()}});
 document.querySelectorAll('[data-recovery]').forEach(function(b){b.onclick=function(){const x=data.recoveryChecks.find(function(q){return q.id===b.dataset.recovery});if(!x||!recoveryReady(x))return;openRecoveryCheck(b.dataset.recovery)}});
 document.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){openWorkout(b.dataset.open)}});
 document.querySelectorAll('[data-sched]').forEach(function(b){b.onclick=function(){openScheduleEditor(b.dataset.sched)}});
 document.querySelectorAll('[data-edit-set]').forEach(function(b){b.onclick=function(){openSetEditor(Number(b.dataset.editSet))}});
 document.querySelectorAll('[data-draft-edit]').forEach(function(b){b.onclick=function(){const p=b.dataset.draftEdit.split('|');openDraftEditor(p[0],Number(p[1]))}});
 if(document.getElementById('back'))document.getElementById('back').onclick=function(){workout=null;render()};
 document.querySelectorAll('[data-w]').forEach(function(b){b.onclick=function(){weight=Math.max(0,weight+Number(b.dataset.w));document.getElementById('wval').textContent=weight}});
 document.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){reps=Math.max(1,reps+Number(b.dataset.r));document.getElementById('rval').textContent=reps}});
 document.querySelectorAll('[data-rpe]').forEach(function(b){b.onclick=function(){rpe=Number(b.dataset.rpe);document.querySelectorAll('[data-rpe]').forEach(function(x){x.classList.toggle('sel',Number(x.dataset.rpe)===rpe)})}});
 if(document.getElementById('setdone'))document.getElementById('setdone').onclick=function(){const seg=inputSegment(workout);if(!seg)return;workout.sets.push({segmentId:seg.id,weight:weight,reps:reps,rpe:rpe,isExtra:!!workout.extraSegmentId,completedAt:new Date().toISOString()});workout.extraSegmentId=null;syncInputToSegment(workout);persistWorkout();render()};
 if(document.getElementById('addExtra'))document.getElementById('addExtra').onclick=function(){const segs=defaultSegments(workout.it),last=segs[segs.length-1],lastSet=workout.sets.filter(function(x){return (x.segmentId||last.id)===last.id}).slice(-1)[0];workout.extraSegmentId=last.id;weight=lastSet?lastSet.weight:last.weight;reps=lastSet?lastSet.reps:last.reps;rpe=lastSet?lastSet.rpe:8;persistWorkout();render()};
 if(document.getElementById('earlyFinish'))document.getElementById('earlyFinish').onclick=function(){if(!workout.sets.length)return alert('최소 한 세트를 기록한 뒤 조기 종료할 수 있습니다.');workout.earlyFinish=true;persistWorkout();renderEvaluation()};
 if(document.getElementById('finish'))document.getElementById('finish').onclick=renderEvaluation;
 if(document.getElementById('savetime'))document.getElementById('savetime').onclick=function(){document.querySelectorAll('[data-date-time]').forEach(function(x){data.dateAvailability[x.dataset.dateTime]=Number(x.value)||0});save();render()};
 if(document.getElementById('autoPlan'))document.getElementById('autoPlan').onclick=autoReplan;
 document.querySelectorAll('[data-volume]').forEach(function(b){b.onclick=function(){data.volumeProposal=buildVolumeProposal(b.dataset.volume);if(!data.volumeProposal)return alert('시간 부족이 없습니다.');save();render()}});
 if(document.getElementById('applyVolume'))document.getElementById('applyVolume').onclick=applyVolumeProposal;
 if(document.getElementById('discardVolume'))document.getElementById('discardVolume').onclick=function(){data.volumeProposal=null;save();render()};
 document.querySelectorAll('[data-block]').forEach(function(b){b.onclick=function(){const target=b.dataset.block,old=data.program.currentBlockId;if(confirm(blockById(target).name+' 블록으로 전환할까요?')){data.blocks.forEach(function(x){x.status=x.id===target?'ACTIVE':x.id===old?'COMPLETED':x.status});data.program.currentBlockId=target;data.programHistory.push({at:new Date().toISOString(),type:'BLOCK_CHANGE',from:old,to:target});save();render()}}});
 if(document.getElementById('applyProposal'))document.getElementById('applyProposal').onclick=applyProposal;
 if(document.getElementById('discardProposal'))document.getElementById('discardProposal').onclick=function(){data.scheduleProposal=null;save();render()};
 if(document.getElementById('makeDraft'))document.getElementById('makeDraft').onclick=generateDraft;
 if(document.getElementById('discardDraft'))document.getElementById('discardDraft').onclick=function(){data.draft=null;save();render()};
 if(document.getElementById('confirmDraft'))document.getElementById('confirmDraft').onclick=confirmDraft;
 if(document.getElementById('saveBw'))document.getElementById('saveBw').onclick=function(){const date=document.getElementById('bwDate').value,weight=Number(document.getElementById('bwWeight').value);if(!date||!weight)return alert('날짜와 체중을 입력해 주세요.');data.bodyweightLogs=data.bodyweightLogs.filter(function(x){return x.date!==date});data.bodyweightLogs.push({id:'bw-'+date,date:date,weight:weight});save();render()};
 document.querySelectorAll('[data-bw-del]').forEach(function(b){b.onclick=function(){data.bodyweightLogs=data.bodyweightLogs.filter(function(x){return x.id!==b.dataset.bwDel});save();render()}});
 if(document.getElementById('backup'))document.getElementById('backup').onclick=function(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='strength-tracker-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
 if(document.getElementById('restore'))document.getElementById('restore').onchange=async function(){const file=this.files&&this.files[0];if(!file)return;try{data=migrate(JSON.parse(await file.text()));save();render()}catch(e){alert('백업 파일을 읽을 수 없습니다.')}};
 if(document.getElementById('reset'))document.getElementById('reset').onclick=function(){if(confirm('모든 로컬 기록을 초기화할까요?')){data=migrate(clone(seed));save();render()}};
}
loadData().then(function(d){data=d;render()}).catch(function(){data=migrate(clone(seed));render()});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
})();
