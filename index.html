<style>
:root{font-family:Inter,system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f4f7fb;color:#111827}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f7f9fc,#edf2f8)}button,input{font:inherit}.app{max-width:520px;min-height:100vh;margin:auto;background:#f8fafc;padding:18px 15px 88px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:24px;margin:0}.sub{font-size:12px;color:#718096;margin:4px 0 0}.card{background:#fff;border:1px solid #e5ebf3;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 8px 24px rgba(31,45,61,.06)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#eaf2ff;color:#1769ff}.meet{display:flex;gap:12px;align-items:center}.meet b{font-size:18px}.meet small{display:block;color:#7b879c;margin-top:3px}.exercise{width:100%;border:0;background:#f6f8fb;border-radius:14px;padding:12px;margin-top:8px;text-align:left;display:flex;justify-content:space-between;align-items:center}.exercise b{display:block}.exercise small{display:block;color:#718096;margin-top:3px}.primary,.secondary,.danger{width:100%;border:0;border-radius:13px;min-height:49px;font-weight:800;margin-top:12px}.primary{background:#1769ff;color:white}.secondary{background:#edf2f7;color:#273449}.danger{background:#df3545;color:white}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);border-top:1px solid #e5eaf1;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:#8b97a8;padding:8px 0;font-size:12px}.nav button.active{color:#1769ff;font-weight:800}.daygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}.day{text-align:center;font-size:11px;color:#6b7280}.dot{width:34px;height:34px;margin:6px auto;border-radius:50%;display:grid;place-items:center;background:#edf1f5;font-weight:900}.done .dot{background:#16b36c;color:white}.today .dot{border:3px solid #1769ff;background:#edf4ff;color:#1769ff}.stepper{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:9px}.stepper button,.rpe button{border:0;border-radius:12px;background:#eef2f7;min-height:48px}.stepper strong{display:grid;place-items:center;background:#edf2f7;border-radius:13px;font-size:29px}.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.rpe button.sel{background:#1769ff;color:white}.label{display:block;font-weight:800;margin:18px 0 8px}.setrow{display:flex;justify-content:space-between;padding:10px 2px;border-top:1px solid #edf0f4}.tag{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.progress{background:#dff7e9;color:#068f4c}.fast{background:#e7edff;color:#435fd0}.hold{background:#edf0f4;color:#667085}.review{background:#fff0d8;color:#ce7800}.reduce{background:#ffe3e5;color:#cd2d3e}.warn{border-left:5px solid #e53945}.warn h3{color:#d92f3c;margin-top:0}.timegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.timegrid label{background:#f3f6fa;padding:9px;border-radius:12px;text-align:center}.timegrid input{width:100%;border:0;background:transparent;text-align:center;font-weight:900;font-size:17px}.muted{color:#7b879c;font-size:12px}.history-item{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf0f4;padding:12px 0}.hidden{display:none}.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:end center;z-index:50}.sheet{width:min(520px,100%);background:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.weeklist .card{margin-top:9px}.smallbtn{border:0;background:#eef4ff;color:#1769ff;border-radius:10px;padding:7px 9px;font-weight:800;font-size:12px}

.session-card{background:#f8fafc;border:1px solid #e7edf4;border-radius:15px;padding:12px;margin-top:10px}.session-card.red{border-color:#ffc7cc;background:#fff7f7}.session-card.yellow{border-color:#ffe0a8;background:#fffbf2}.risk{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900}.risk.green{background:#dcf8e8;color:#087c49}.risk.yellow{background:#fff0c9;color:#a76500}.risk.red{background:#ffe2e5;color:#c92e3b}.actionrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actionrow button{border:0;border-radius:11px;min-height:42px;font-weight:800}.ghost{background:#eef2f7;color:#334155}.outline{background:#fff;border:1px solid #d7e0ea!important;color:#334155}.dayblock{margin-top:14px}.dayhead{display:flex;align-items:center;justify-content:space-between}.dayhead h3{margin:0}.statusline{font-size:11px;color:#7c8799;margin-top:3px}.reviewgrid{display:grid;gap:8px;margin-top:10px}.reviewrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #edf0f4}.draftbox{border:1px solid #cddcff;background:#f5f8ff;border-radius:15px;padding:13px;margin-top:10px}.modal-card{width:min(500px,calc(100% - 24px));background:#fff;border-radius:22px;padding:18px;margin:0 auto 14px;max-height:84vh;overflow:auto}.modal-center{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;align-items:end;z-index:80;padding-bottom:env(safe-area-inset-bottom)}.target-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.target-grid button{border:0;border-radius:12px;padding:10px 6px;background:#eef3f8;font-weight:800}.choice-grid{display:flex;flex-wrap:wrap;gap:7px}.choice{border:0;border-radius:999px;padding:8px 10px;background:#eef2f7}.choice.sel{background:#1769ff;color:#fff}.textarea{width:100%;min-height:80px;border:1px solid #dbe3ec;border-radius:12px;padding:10px;resize:vertical}.proposal{padding:9px 0;border-top:1px solid #edf0f4}.disabled{opacity:.45;pointer-events:none}.banner{border-radius:14px;padding:12px;margin-top:10px;font-size:12px}.banner.info{background:#edf4ff;color:#2459b4}.banner.warn{background:#fff5df;color:#a96800;border-left:0}.banner.danger{background:#fff0f2;color:#b92937;border-left:0}

</style>
</head>
<body>
<div id="app" class="app"></div>
<nav class="nav" id="nav"></nav>
<script>
(function(){
const STORAGE='strength-tracker-v1';
const DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
const seed={
 version:2,week:1,meet:'2026-11-29',
 days:[
 {d:'MON',scheduled:'MON',label:'SQ High + Arm A',mins:120,status:'PLANNED',items:[
 {name:'Squat',type:'High',weight:115,sets:8,reps:3,rpeMin:7,rpeMax:8,rule:'SQ_HIGH'},
 {name:'Pronation',type:'Arm A',weight:0,sets:3,reps:8,rpeMin:6,rpeMax:7,rule:'ARM'}]},
 {d:'TUE',scheduled:'TUE',label:'BP High',mins:70,status:'PLANNED',items:[
 {name:'Bench Press',type:'High',weight:90,sets:1,reps:4,rpeMin:7,rpeMax:8,rule:'BP_HIGH',segments:[
 {id:'top',label:'Top Set',weight:90,sets:1,reps:4,repsMin:4,repsMax:6,rpeMin:7,rpeMax:8},
 {id:'backoff',label:'Backoff',weight:80,sets:3,reps:5,repsMin:5,repsMax:5,rpeMin:6.5,rpeMax:7.5}
 ]}]},
 {d:'WED',scheduled:'WED',label:'DL Main + SQ Low',mins:100,status:'PLANNED',items:[
 {name:'Deadlift',type:'Main',weight:175,sets:1,reps:3,rpeMin:7,rpeMax:8,rule:'DL_MAIN',segments:[
 {id:'top',label:'Top Set',weight:175,sets:1,reps:3,repsMin:3,repsMax:5,rpeMin:7,rpeMax:8},
 {id:'backoff',label:'Backoff',weight:152.5,sets:2,reps:5,repsMin:5,repsMax:5,rpeMin:6.5,rpeMax:7.5}
 ]},
 {name:'Squat',type:'Low',weight:100,sets:3,reps:5,rpeMin:5,rpeMax:6,rule:'LOW'}]},
 {d:'THU',scheduled:'THU',label:'BP Low',mins:60,status:'PLANNED',items:[
 {name:'Bench Press',type:'Low',weight:72.5,sets:3,reps:5,rpeMin:5,rpeMax:6,rule:'LOW'}]},
 {d:'FRI',scheduled:'FRI',label:'SQ Medium + BP Medium + Arm B',mins:140,status:'PLANNED',items:[
 {name:'Squat',type:'Medium',weight:110,sets:4,reps:4,rpeMin:6.5,rpeMax:7.5,rule:'SQ_MED'},
 {name:'Bench Press',type:'Medium TnG',weight:77.5,sets:4,reps:8,rpeMin:6,rpeMax:7.5,rule:'BP_MED'},
 {name:'Side Pressure',type:'Arm B',weight:0,sets:4,reps:6,rpeMin:6,rpeMax:7,rule:'ARM'}]}
 ],
 available:{MON:120,TUE:70,WED:100,THU:60,FRI:140,SAT:120,SUN:0},
 logs:[],recommendations:[],archives:[],draft:null,scheduleProposal:null,streaks:{}
};
let data=load(),tab='home',workout=null,weight=0,reps=0,rpe=8,evalState=null;

function clone(x){return JSON.parse(JSON.stringify(x))}
function defaultSegments(it){
 if(it.segments&&it.segments.length)return it.segments;
 if(it.rule==='BP_HIGH')return [
  {id:'top',label:'Top Set',weight:it.weight,sets:1,reps:it.reps||4,repsMin:4,repsMax:6,rpeMin:7,rpeMax:8},
  {id:'backoff',label:'Backoff',weight:Math.round((it.weight*0.89)*2)/2,sets:3,reps:5,repsMin:5,repsMax:5,rpeMin:6.5,rpeMax:7.5}
 ];
 if(it.rule==='DL_MAIN')return [
  {id:'top',label:'Top Set',weight:it.weight,sets:1,reps:it.reps||3,repsMin:3,repsMax:5,rpeMin:7,rpeMax:8},
  {id:'backoff',label:'Backoff',weight:Math.round((it.weight*0.87)*2)/2,sets:2,reps:5,repsMin:5,repsMax:5,rpeMin:6.5,rpeMax:7.5}
 ];
 return [{id:'main',label:'Main',weight:it.weight,sets:it.sets,reps:it.reps,repsMin:it.reps,repsMax:it.reps,rpeMin:it.rpeMin,rpeMax:it.rpeMax}];
}
function ensureSegments(it){it.segments=defaultSegments(it).map(function(s){return Object.assign({},s)});return it}
function segmentSummary(it){
 const segs=defaultSegments(it);
 if(segs.length===1)return (segs[0].weight||'—')+'kg · '+segs[0].sets+'×'+segs[0].reps+' · @'+segs[0].rpeMin+'~'+segs[0].rpeMax;
 return segs.map(function(s){return s.label+' '+(s.weight||'—')+'kg '+s.sets+'×'+(s.repsMin!==s.repsMax?s.repsMin+'~'+s.repsMax:s.reps)}).join(' / ');
}
function segmentSets(w,id){return w.sets.filter(function(s){return (s.segmentId||'top')===id})}
function activeSegment(w){
 const segs=defaultSegments(w.it);
 for(let i=0;i<segs.length;i++){if(segmentSets(w,segs[i].id).length<segs[i].sets)return segs[i]}
 return null;
}
function syncInputToSegment(w){
 const s=activeSegment(w);if(!s)return;
 const arr=segmentSets(w,s.id);
 weight=arr.length?arr[arr.length-1].weight:s.weight;
 reps=arr.length?arr[arr.length-1].reps:s.reps;
 rpe=8;
}
function migrate(x){
 if(!x||typeof x!=='object')x=clone(seed);
 x.version=2;x.available=x.available||clone(seed.available);x.logs=x.logs||[];x.recommendations=x.recommendations||[];x.archives=x.archives||[];x.draft=x.draft||null;x.scheduleProposal=x.scheduleProposal||null;x.streaks=x.streaks||{};
 x.days=(x.days||clone(seed.days)).map(function(d){d.scheduled=d.scheduled||d.d;d.status=d.status||'PLANNED';d.skipReason=d.skipReason||null;d.items=(d.items||[]).map(ensureSegments);return d});
 return x;
}
function load(){try{return migrate(JSON.parse(localStorage.getItem(STORAGE))||clone(seed))}catch(e){return migrate(clone(seed))}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dday(){const a=new Date();a.setHours(0,0,0,0);const b=new Date(data.meet+'T00:00:00');return Math.max(0,Math.ceil((b-a)/86400000))}
function isResolved(s){return ['COMPLETED','SKIPPED','CARRIED'].includes(s.status)}
function getNext(){const active=data.days.filter(function(x){return !isResolved(x)}).sort(function(a,b){return DAYS.indexOf(a.scheduled)-DAYS.indexOf(b.scheduled)});return active[0]||null}
function getLog(day,item){return data.logs.find(function(x){return x.day===day.d&&x.name===item.name&&x.type===item.type})}
function getRec(day,item){return data.recommendations.find(function(x){return x.day===day.d&&x.name===item.name&&x.type===item.type})}
function sessionPriority(s){if(s.items.some(function(i){return ['SQ_HIGH','BP_HIGH','DL_MAIN'].includes(i.rule)}))return 'A';if(s.items.some(function(i){return ['SQ_MED','BP_MED'].includes(i.rule)}))return 'B';if(s.items.some(function(i){return i.rule==='LOW'}))return 'C';return 'D'}
function lowStreakKey(it){return it.name+'|'+it.type}
function resultClass(v){return v==='PROGRESS'?'progress':v==='FAST_TRACK'?'fast':v==='REDUCE'?'reduce':v==='REVIEW'?'review':'hold'}
function ruleProfile(it){
 if(it.rule==='SQ_HIGH')return {overall:5,lower:5,upper:1,axial:5,elbow:1};
 if(it.rule==='DL_MAIN')return {overall:5,lower:5,upper:1,axial:5,elbow:1};
 if(it.rule==='BP_HIGH')return {overall:4,lower:1,upper:4,axial:2,elbow:3};
 if(it.rule==='SQ_MED')return {overall:3,lower:3,upper:1,axial:3,elbow:1};
 if(it.rule==='BP_MED')return {overall:3,lower:1,upper:3,axial:1,elbow:2};
 if(it.rule==='LOW'&&it.name==='Squat')return {overall:2,lower:2,upper:1,axial:2,elbow:1};
 if(it.rule==='LOW')return {overall:2,lower:1,upper:2,axial:1,elbow:2};
 return {overall:2,lower:1,upper:2,axial:0,elbow:4};
}
function sessionProfile(s){
 const p={overall:0,lower:0,upper:0,axial:0,elbow:0};
 s.items.forEach(function(it){const q=ruleProfile(it);Object.keys(p).forEach(function(k){p[k]=Math.max(p[k],q[k])})});
 if(s.items.length>1)p.overall=Math.min(5,p.overall+.5);
 return p;
}
function sessionsOn(day,override){
 return data.days.filter(function(s){if(isResolved(s))return false;const at=override&&override[s.d]?override[s.d]:s.scheduled;return at===day});
}
function riskFor(list,day){
 if(!list.length)return {level:'GREEN',reasons:[],mins:0};
 const mins=list.reduce(function(a,s){return a+s.mins},0),available=Number(data.available[day]||0),reasons=[];
 let level='GREEN';
 if(available===0){level='RED';reasons.push('운동 가능 시간이 0분입니다.')}
 else if(mins>available){level='RED';reasons.push('예상 '+mins+'분 > 가능 '+available+'분')}
 for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
   const a=list[i],b=list[j],pa=sessionProfile(a),pb=sessionProfile(b),prioA=sessionPriority(a),prioB=sessionPriority(b);
   const rules=a.items.concat(b.items).map(function(x){return x.rule});
   if(rules.includes('SQ_HIGH')&&rules.includes('DL_MAIN')){level='RED';reasons.push('SQ High와 DL Main의 Lower/Axial 피로가 직접 충돌합니다.')}
   else if(prioA==='A'&&prioB==='A'&&level!=='RED'){level='YELLOW';reasons.push('High/Main 세션 두 개가 같은 날입니다.')}
   if(pa.axial+pb.axial>=9||pa.lower+pb.lower>=9){level='RED';reasons.push('Lower/Axial 피로 중첩이 큽니다.')}
   else if((pa.upper+pb.upper>=7||pa.elbow+pb.elbow>=7)&&level==='GREEN'){level='YELLOW';reasons.push('Upper/Elbow 피로가 겹칩니다.')}
 }
 return {level:level,reasons:[...new Set(reasons)],mins:mins};
}
function currentCombinedRisk(session){
 const list=sessionsOn(session.scheduled);
 return riskFor(list,session.scheduled);
}
function nav(){document.getElementById('nav').innerHTML=['home:⌂ 홈','week:▦ 주간','history:▥ 기록','settings:⚙ 설정'].map(function(x){const p=x.split(':');return '<button data-tab="'+p[0]+'" class="'+(tab===p[0]?'active':'')+'">'+p[1]+'</button>'}).join('')}
function render(){nav();if(workout){renderWorkout();bind();return}if(tab==='home')home();else if(tab==='week')week();else if(tab==='history')history();else settings();bind()}
function itemRow(day,it,idx){const log=getLog(day,it);return '<button class="exercise" data-open="'+day.d+'|'+idx+'"><span><b>'+esc(it.name)+' '+esc(it.type)+'</b><small>'+esc(segmentSummary(it))+'</small></span><span>'+(log?'✓':'›')+'</span></button>'}

function home(){
 const n=getNext(),done=data.days.filter(isResolved).length,all=done===data.days.length;
 document.getElementById('app').innerHTML=
 '<div class="top"><div><h1>Strength Tracker</h1><p class="sub">Long-term Strength 01 · Accumulation W'+data.week+'</p></div><span class="pill">LOCAL PWA</span></div>'+
 '<section class="card meet"><span style="font-size:26px">🏆</span><div><b>대회 D-'+dday()+'</b><small>2026.11.29 · 67kg급</small></div></section>'+
 (all?
 '<section class="card"><span class="tag progress">WEEK RESOLVED</span><h2>W'+data.week+' 주간 Review 준비 완료</h2><p class="muted">완료·Skip·Carry Over 처리가 모두 끝났습니다.</p><button class="primary" data-tab="week">주간 Review 열기</button></section>':
 '<section class="card"><div class="row"><div><h2 style="margin:0;font-size:18px">다음 훈련</h2><p class="sub">'+n.scheduled+' · 예상 '+n.mins+'분'+(n.scheduled!==n.d?' · 원래 '+n.d:'')+'</p></div><span class="pill">Priority '+sessionPriority(n)+'</span></div>'+
 n.items.map(function(it,i){return itemRow(n,it,i)}).join('')+
 '<button class="primary" data-open="'+n.d+'|0">▶ 훈련 시작</button></section>')+
 '<section class="card"><div class="row"><h2 style="font-size:18px;margin:0">이번 주 진행</h2><button class="smallbtn" data-tab="week">일정 관리</button></div>'+
 '<div class="daygrid">'+data.days.slice(0,5).map(function(x){const cls=x.status==='COMPLETED'?'day done':x===n?'day today':'day';return '<div class="'+cls+'"><b>'+x.d+'</b><span class="dot">'+(x.status==='COMPLETED'?'✓':x.status==='SKIPPED'?'–':x.status==='CARRIED'?'↗':x===n?'●':'○')+'</span><small>'+esc(x.status)+'</small></div>'}).join('')+'</div><p class="muted">'+done+' / '+data.days.length+' sessions resolved</p></section>';
}

function openWorkout(code){
 const parts=code.split('|'),day=data.days.find(function(x){return x.d===parts[0]}),idx=Number(parts[1]),it=ensureSegments(day.items[idx]),log=getLog(day,it);
 if(day.status==='SKIPPED'||day.status==='CARRIED')return alert('이 세션은 '+day.status+' 상태입니다. 주간 화면에서 상태를 되돌린 뒤 진행하세요.');
 workout={day:day,idx:idx,it:it,sets:log?log.sets.slice():[]};
 // Legacy logs without segmentId belong to the top/main segment.
 const first=defaultSegments(it)[0].id;
 workout.sets=workout.sets.map(function(s){return Object.assign({segmentId:first},s)});
 syncInputToSegment(workout);evalState=null;render();
}
function renderWorkout(){
 const w=workout,it=w.it,segs=defaultSegments(it),seg=activeSegment(w),done=!seg,risk=currentCombinedRisk(w.day);
 const progress=segs.map(function(s){
  const n=segmentSets(w,s.id).length;
  return '<div class="proposal"><div class="row"><b>'+esc(s.label)+'</b><span class="pill">'+n+' / '+s.sets+'</span></div><div class="muted">'+(s.weight||'—')+'kg · '+s.sets+'×'+(s.repsMin!==s.repsMax?s.repsMin+'~'+s.repsMax:s.reps)+' · @'+s.rpeMin+'~'+s.rpeMax+'</div></div>'
 }).join('');
 document.getElementById('app').innerHTML='<div class="row"><button class="smallbtn" id="back">‹ 돌아가기</button><b>세트 입력</b><span></span></div>'+
 '<section class="card"><div class="row"><div><h2 style="margin:0">'+esc(it.name)+' '+esc(it.type)+'</h2><p class="muted">'+w.day.scheduled+' · Top/Backoff 독립 기록</p></div><span class="risk '+risk.level.toLowerCase()+'">'+risk.level+'</span></div>'+progress+
 (risk.level==='RED'?'<div class="banner danger">고피로/시간 충돌 상황입니다. 이 세션의 RPE는 progression 판정에서 보수적으로 해석됩니다.</div>':'')+
 (done?'<div class="banner info">계획된 모든 세트를 완료했습니다.</div>':
 '<div class="banner info"><b>'+esc(seg.label)+'</b> 입력 중 · '+(segmentSets(w,seg.id).length+1)+' / '+seg.sets+' 세트</div>'+
 '<span class="label">중량 (kg)</span><div class="stepper"><button data-w="-2.5">-2.5</button><strong id="wval">'+weight+'</strong><button data-w="2.5">+2.5</button></div>'+

function evaluate(ctx){
 const w=workout,it=w.it,segs=defaultSegments(it),all=w.sets,allR=all.map(function(x){return x.rpe}),max=Math.max.apply(null,allR),last=allR[allR.length-1];
 const critical=ctx.tech.some(function(x){return ['Grip Open','Bar Roll','Brace Loss','Upper Back Loss','Wedge Failure'].includes(x)});
 const majorExternal=ctx.external.some(function(x){return ['J-cup Collision','Strap Failure','Slippery Bar/Bench'].includes(x)});
 const combined=currentCombinedRisk(w.day).level==='RED';
 const blocked=ctx.pain>=3||critical||((majorExternal||combined)&&max>=8.5);
 const lowKey=it.rule==='LOW'?lowStreakKey(it):null;
 let verdict='HOLD',next=it.weight,nsets=it.sets,nreps=it.reps,msg='동일 계획 유지',segmentRecommendations=[];
 if(segs.length>1&&(it.rule==='BP_HIGH'||it.rule==='DL_MAIN')){
  segmentRecommendations=segs.map(function(s){
   const ss=segmentSets(w,s.id),rs=ss.map(function(x){return x.rpe}),mx=Math.max.apply(null,rs),lst=rs[rs.length-1];
   let v='HOLD',nw=s.weight,nr=s.reps,ns=s.sets,m='동일 계획 유지';
   if(blocked){v='REVIEW';m=ctx.pain>=3?'통증으로 자동 progression 보류':critical?'기술 이슈로 자동 progression 보류':'외부/고피로 변수로 판정 보류'}
   else if(s.id==='top'){
    const cap=it.rule==='BP_HIGH'?6:5,base=it.rule==='BP_HIGH'?4:3;
    if(mx<=8){v='PROGRESS';if(s.reps<cap)nr=s.reps+1;else{nw=s.weight+2.5;nr=base}m='Top set: reps 우선 progression'}
    else if(mx>=9){v='HOLD';m='Top set @9+: 중량 유지'}
   }else{
    if(mx<=7.5){v='PROGRESS';nw=s.weight+2.5;m='Backoff 독립 +2.5kg'}
    else if(mx>=8.5){v='HOLD';m='Backoff 난도 과다: 유지'}
   }
   return {id:s.id,label:s.label,verdict:v,nextWeight:nw,nextSets:ns,nextReps:nr,max:mx,last:lst,msg:m}
  });
  const rank={REDUCE:5,REVIEW:4,HOLD:3,FAST_TRACK:2,PROGRESS:1};
  const worst=segmentRecommendations.slice().sort(function(a,b){return (rank[b.verdict]||0)-(rank[a.verdict]||0)})[0];
  verdict=worst.verdict;msg='Top/Backoff를 독립 판정했습니다.';
  const topRec=segmentRecommendations.find(function(x){return x.id==='top'});
  next=topRec.nextWeight;nsets=topRec.nextSets;nreps=topRec.nextReps;
 }else{
  if(ctx.pain>=3){verdict='REVIEW';msg='통증 '+ctx.pain+': 자동 progression 보류';if(lowKey)data.streaks[lowKey]=0}
  else if(critical){verdict='REVIEW';msg='Critical technique issue: 자동 progression 보류';if(lowKey)data.streaks[lowKey]=0}
  else if((majorExternal||combined)&&max>=8.5){verdict='REVIEW';msg=(majorExternal?'외부 변수':'고피로 병합')+'로 고RPE 해석 보류'}
  else if(it.rule==='SQ_HIGH'){
    if(max<=5.5&&last<=5.5){verdict='FAST_TRACK';next=it.weight+5;msg='매우 여유로움: +5kg 8×3 제안'}
    else if(max<=6.5&&last<=6.5){verdict='FAST_TRACK';next=it.weight+2.5;msg='여유로움: +2.5kg 8×3 제안'}
    else if(max<=8){verdict='PROGRESS';nsets=5;nreps=5;msg='동일중량 5×5'}
    else if(max===8.5){verdict='HOLD';msg='동일중량 8×3 유지'}
    else {verdict='REDUCE';next=Math.max(0,it.weight-2.5);msg='RPE 과다: -2.5kg 검토'}
  }else if(it.rule==='SQ_MED'){
    if(max<=7.5){verdict='PROGRESS';if(it.reps<5)nreps=it.reps+1;else{next=it.weight+2.5;nreps=3}msg='Medium 4×3→4→5 progression'}else if(max>=8.5){verdict='HOLD';msg='Medium 난도 과다: 유지'}
  }else if(it.rule==='BP_MED'){
    if(max<=7.5){verdict='PROGRESS';if(it.reps<10)nreps=it.reps+1;else{next=it.weight+2.5;nreps=8}msg='TnG 4×8→9→10 progression'}else if(max>=8){verdict='HOLD';msg='TnG 난도 과다: 유지'}
  }else if(it.rule==='LOW'){
    if(max<=6){
      const streak=(data.streaks[lowKey]||0)+1;
      if(streak>=2){verdict='PROGRESS';next=it.weight+2.5;msg='Low day 2/2 성공 → +2.5kg';data.streaks[lowKey]=0}
      else{verdict='HOLD';msg='Low day 성공 '+streak+'/2 · 동일 중량 유지';data.streaks[lowKey]=streak}
    }else{verdict='HOLD';msg='Low day @7+ · 성공 streak 초기화';data.streaks[lowKey]=0}
  }
  else if(it.rule==='ARM'){verdict=max<=it.rpeMax&&ctx.pain<=1?'PROGRESS':'HOLD';msg=verdict==='PROGRESS'?'반복수/부하 증가 가능':'관절/RPE 기준으로 유지'}
 }
 data.recommendations=data.recommendations.filter(function(x){return !(x.day===w.day.d&&x.name===it.name&&x.type===it.type)});
 data.recommendations.push({day:w.day.d,name:it.name,type:it.type,verdict:verdict,next:next,nsets:nsets,nreps:nreps,max:max,last:last,msg:msg,pain:ctx.pain,tech:ctx.tech,external:ctx.external,combined:combined,segmentRecommendations:segmentRecommendations,lowStreak:lowKey?(data.streaks[lowKey]||0):null});
 data.logs=data.logs.filter(function(x){return !(x.day===w.day.d&&x.name===it.name&&x.type===it.type)});
 data.logs.push({day:w.day.d,scheduled:w.day.scheduled,name:it.name,type:it.type,sets:w.sets,evaluation:ctx,completedAt:new Date().toISOString()});
 const dayLogs=w.day.items.filter(function(x){return getLog(w.day,x)||(x.name===it.name&&x.type===it.type)}).length;
 if(dayLogs>=w.day.items.length)w.day.status='COMPLETED';
 save();
 const detail=segmentRecommendations.length?'<div class="card" style="box-shadow:none;background:#f6f8fb">'+segmentRecommendations.map(function(r){return '<div class="proposal"><div class="row"><b>'+esc(r.label)+'</b><span class="tag '+resultClass(r.verdict)+'">'+r.verdict+'</span></div><div>'+r.nextWeight+'kg · '+r.nextSets+'×'+r.nextReps+'</div><div class="muted">'+esc(r.msg)+' · 최고 @'+r.max+'</div></div>'}).join('')+'</div>':'<div class="card" style="box-shadow:none;background:#f6f8fb"><small class="muted">다음 제안</small><h3 style="margin:4px 0">'+next+'kg · '+nsets+'×'+nreps+'</h3></div>';
 document.getElementById('app').innerHTML='<div class="row"><button class="smallbtn" id="closeResult">‹ 홈</button><b>자동 판정</b><span></span></div><section class="card"><span class="tag '+resultClass(verdict)+'">'+verdict+'</span><h2>'+esc(it.name)+' '+esc(it.type)+'</h2><p>'+esc(msg)+'</p>'+detail+'<p class="muted">전체 최고 RPE '+max+' · 마지막 RPE '+last+' · 통증 '+ctx.pain+'</p></section>';
 document.getElementById('closeResult').onclick=function(){workout=null;evalState=null;tab='home';render()};
}

 document.getElementById('app').innerHTML='<div class="top"><div><h1>주간 일정</h1><p class="sub">가능 시간 · 이동/병합 · 피로도</p></div><span class="pill">W'+data.week+'</span></div>'+
 '<section class="card"><div class="row"><h3>일별 가능 시간</h3><button id="savetime" class="smallbtn">저장</button></div><div class="timegrid">'+DAYS.map(function(d){return '<label><b>'+d+'</b><input data-time="'+d+'" type="number" value="'+(data.available[d]||0)+'"><small>분</small></label>'}).join('')+'</div><button class="secondary" id="autoPlan">자동 재배치 제안</button></section>'+
 (data.scheduleProposal?'<section class="card"><div class="row"><h3>자동 재배치 Draft</h3><button class="smallbtn" id="discardProposal">취소</button></div>'+data.scheduleProposal.map(function(p){return '<div class="proposal"><b>'+esc(p.label)+'</b><div class="muted">'+p.from+' → '+p.to+(p.from===p.to?' · 유지':'')+'</div></div>'}).join('')+'<button class="primary" id="applyProposal">이 일정 적용</button></section>':'')+
 '<section class="card"><h3>현재 배치</h3>'+DAYS.map(dayScheduleHtml).join('')+'</section>'+
 '<section class="card"><div class="row"><div><h3 style="margin:0">W'+data.week+' Review</h3><p class="muted">'+resolvedCount+' / '+data.days.length+' sessions resolved</p></div><span class="tag '+(resolved?'progress':'hold')+'">'+(resolved?'READY':'IN PROGRESS')+'</span></div>'+
 '<div class="reviewgrid">'+data.days.map(function(s){return '<div class="reviewrow"><div><b>'+s.d+' · '+esc(s.label)+'</b><small class="muted">'+s.status+(s.skipReason?' · '+esc(s.skipReason):'')+'</small></div><span>'+s.items.map(function(it){const r=getRec(s,it);return r?'<span class="tag '+resultClass(r.verdict)+'">'+r.verdict+(r.lowStreak!==null&&r.lowStreak!==undefined?' · '+r.lowStreak+'/2':'')+'</span>':''}).join(' ')+'</span></div>'}).join('')+'</div>'+
 (!data.draft?'<button class="primary '+(resolved?'':'disabled')+'" id="makeDraft">W'+(data.week+1)+' Draft 생성</button>':
 '<div class="draftbox"><div class="row"><b>W'+data.draft.week+' DRAFT</b><span class="pill">미확정</span></div>'+data.draft.days.map(function(s){return '<div class="proposal"><b>'+s.d+' · '+esc(s.label)+'</b>'+s.items.map(function(it,idx){return '<div class="session-card"><div class="row"><div><b>'+esc(it.name+' '+it.type)+'</b><div class="muted">'+esc(segmentSummary(it))+'</div>'+(it.override?'<div class="muted">Override · '+esc(it.override.reason)+(it.override.note?' · '+esc(it.override.note):'')+'</div>':'')+'</div><button class="smallbtn" data-draft-edit="'+s.d+'|'+idx+'">'+(it.override?'수정됨':'수정')+'</button></div></div>'}).join('')+'</div>'}).join('')+'<div class="actionrow"><button class="ghost" id="discardDraft">Draft 삭제</button><button class="primary" id="confirmDraft" style="margin-top:0">W'+data.draft.week+' 확정</button></div></div>')+
 '</section>';
}
function history(){
 const current=data.logs.length?'<section class="card"><h3>현재 W'+data.week+'</h3>'+data.logs.slice().reverse().map(function(l){const r=data.recommendations.find(function(x){return x.day===l.day&&x.name===l.name&&x.type===l.type});return '<div class="history-item"><div><b>'+l.day+' · '+esc(l.name)+' '+esc(l.type)+'</b><small class="muted">'+l.sets.length+'세트 · '+(l.evaluation?'통증 '+l.evaluation.pain:'')+'</small></div>'+(r?'<span class="tag '+resultClass(r.verdict)+'">'+r.verdict+'</span>':'')+'</div>'}).join('')+'</section>':'';
 const archived=data.archives.slice().reverse().map(function(a){return '<section class="card"><div class="row"><h3 style="margin:0">W'+a.week+'</h3><span class="tag progress">ARCHIVED</span></div><p class="muted">'+a.logs.length+' exercise logs · '+new Date(a.completedAt).toLocaleDateString('ko-KR')+'</p></section>'}).join('');
 document.getElementById('app').innerHTML='<div class="top"><div><h1>기록</h1><p class="sub">현재 주차 + 보존된 과거 주차</p></div></div>'+current+(archived||(!current?'<section class="card"><p class="muted">아직 기록이 없습니다.</p></section>':''));
}
function settings(){
 document.getElementById('app').innerHTML='<div class="top"><div><h1>설정</h1><p class="sub">서버 없는 로컬 저장</p></div></div><section class="card"><h3>데이터 관리</h3><p class="muted">기록은 이 폰 브라우저에 저장됩니다. 폰 교체/브라우저 데이터 삭제 전에 JSON 백업을 권장합니다.</p><button class="primary" id="backup">JSON 백업</button><label class="secondary" style="display:grid;place-items:center;margin-top:10px;height:49px;border-radius:13px;font-weight:800">백업 복원<input id="restore" type="file" accept="application/json" style="display:none"></label><button class="danger" id="reset">전체 초기화</button></section>'+
 '<section class="card"><h3>현재 데이터</h3><p class="muted">Schema v'+data.version+' · W'+data.week+' · 보관 주차 '+data.archives.length+'개</p></section>';
}
function bind(){
 document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;workout=null;render()}});
 document.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){openWorkout(b.dataset.open)}});
 document.querySelectorAll('[data-sched]').forEach(function(b){b.onclick=function(){openScheduleEditor(b.dataset.sched)}});
 document.querySelectorAll('[data-draft-edit]').forEach(function(b){b.onclick=function(){const p=b.dataset.draftEdit.split('|');openDraftEditor(p[0],Number(p[1]))}});
 if(document.getElementById('back'))document.getElementById('back').onclick=function(){workout=null;render()};
 document.querySelectorAll('[data-w]').forEach(function(b){b.onclick=function(){weight=Math.max(0,weight+Number(b.dataset.w));document.getElementById('wval').textContent=weight}});
 document.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){reps=Math.max(1,reps+Number(b.dataset.r));document.getElementById('rval').textContent=reps}});
 document.querySelectorAll('[data-rpe]').forEach(function(b){b.onclick=function(){rpe=Number(b.dataset.rpe);document.querySelectorAll('[data-rpe]').forEach(function(x){x.classList.toggle('sel',Number(x.dataset.rpe)===rpe)})}});
 if(document.getElementById('setdone'))document.getElementById('setdone').onclick=function(){const seg=activeSegment(workout);if(!seg)return;workout.sets.push({segmentId:seg.id,weight:weight,reps:reps,rpe:rpe});syncInputToSegment(workout);render()};
 if(document.getElementById('finish'))document.getElementById('finish').onclick=renderEvaluation;
 if(document.getElementById('savetime'))document.getElementById('savetime').onclick=function(){document.querySelectorAll('[data-time]').forEach(function(x){data.available[x.dataset.time]=Number(x.value)||0});save();render()};
 if(document.getElementById('autoPlan'))document.getElementById('autoPlan').onclick=autoReplan;
 if(document.getElementById('applyProposal'))document.getElementById('applyProposal').onclick=applyProposal;
 if(document.getElementById('discardProposal'))document.getElementById('discardProposal').onclick=function(){data.scheduleProposal=null;save();render()};
 if(document.getElementById('makeDraft'))document.getElementById('makeDraft').onclick=generateDraft;
 if(document.getElementById('discardDraft'))document.getElementById('discardDraft').onclick=function(){data.draft=null;save();render()};
 if(document.getElementById('confirmDraft'))document.getElementById('confirmDraft').onclick=confirmDraft;
 if(document.getElementById('backup'))document.getElementById('backup').onclick=function(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='strength-tracker-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
 if(document.getElementById('restore'))document.getElementById('restore').onchange=async function(){const file=this.files&&this.files[0];if(!file)return;try{data=migrate(JSON.parse(await file.text()));save();render()}catch(e){alert('백업 파일을 읽을 수 없습니다.')}};
 if(document.getElementById('reset'))document.getElementById('reset').onclick=function(){if(confirm('모든 로컬 기록을 초기화할까요?')){data=migrate(clone(seed));save();render()}};
}
render();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
})();
</script>
</body>
</html>
